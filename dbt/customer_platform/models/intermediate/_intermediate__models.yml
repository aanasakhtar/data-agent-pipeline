version: 2

models:
  - name: int_customer_orders
    description: >
      Orders joined with the customer's current attributes at query time, plus
      derived fields (days since signup, order sequence number per customer).
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]

  - name: int_order_items_enriched
    description: Order items joined with product catalog details for line-level economics.
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

snapshots:
  - name: customers_snapshot
    description: >
      SCD Type 2 history of customers.plan_tier and customers.status changes over time
      (dbt native snapshot, check strategy). See docs/decisions.md item E.
    columns:
      - name: customer_id
        tests: [not_null]
      - name: dbt_valid_from
        tests: [not_null]
