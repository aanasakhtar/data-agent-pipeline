version: 2

models:
  - name: dim_customers
    description: Current customer attributes, sourced from the customers_snapshot's latest version per customer.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_status
        tests:
          - accepted_values:
              values: ['active', 'churned']

  - name: dim_products
    description: One row per product.
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: dim_dates
    description: Date spine from 2022-01-01 to 2026-12-31 for time-based rollups.
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: fct_orders
    description: Grain -- one row per order.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['pending', 'completed', 'cancelled', 'refunded']

  - name: fct_support_tickets
    description: Grain -- one row per support ticket.
    columns:
      - name: ticket_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: priority
        tests:
          - accepted_values:
              values: ['low', 'medium', 'high']
